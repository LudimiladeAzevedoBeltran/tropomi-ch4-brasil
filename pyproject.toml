[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tropomi-ch4"
version = "0.1.0"
description = "Séries e mapas de metano (CH4) do Sentinel-5P/TROPOMI para o Brasil."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ludimila de Azevedo Beltran", email = "azevedo.beltran@unesp.br" }]
keywords = ["TROPOMI", "Sentinel-5P", "metano", "CH4", "Copernicus", "Brasil"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
l2 = ["h5py>=3.10", "rasterio>=1.3"]
maps = ["xarray>=2023.1", "rioxarray>=0.15", "scipy>=1.10"]
gee = ["earthengine-api>=1.5", "geemap>=0.35", "gdown>=5.0"]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["tropomi_ch4*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
