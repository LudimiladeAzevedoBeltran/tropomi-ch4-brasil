# Publica o site Quarto (docs/) no GitHub Pages a cada push em `main`.
#
# Pré-requisito: em Settings -> Pages, escolha a branch `gh-pages` (a ação cria
# essa branch) ou o modo "GitHub Actions", conforme o método escolhido.
name: Render and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
